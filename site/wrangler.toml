# Site Aurum Wood – publicado automaticamente pelo Cloudflare a cada commit
# Cloudflare > Workers & Pages > Create > Continue with GitHub > repositório: aurum-wood-servidor > Root directory: site
name = "aurumwood"
compatibility_date = "2026-06-01"
workers_dev = true

routes = [
  { pattern = "aurumwood.com.br", custom_domain = true },
  { pattern = "www.aurumwood.com.br", custom_domain = true }
]

[assets]
directory = "./public"
